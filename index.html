<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin · Riego Inteligente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/admin.css">
    <script>
        if (localStorage.getItem('adminToken')) {
            window.location.replace('dashboard.html');
        }
    </script>
</head>

<body class="admin-bg">
    <div class="admin-wrapper">
        <div class="card admin-card shadow-lg border-0 rounded-4">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <i class="bi bi-shield-lock display-4 text-primary"></i>
                    <h1 class="h4 fw-bold mt-2 mb-1">Panel Administrador</h1>
                    <p class="text-muted small mb-0">Riego Inteligente</p>
                </div>

                <div id="alert" class="d-none"></div>

                <form id="loginAdminForm" novalidate>
                    <div class="mb-3">
                        <label for="username" class="form-label fw-semibold">Usuario admin</label>
                        <input type="text" class="form-control form-control-lg" id="username"
                               autocomplete="username" required minlength="4" maxlength="50">
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label fw-semibold">Contraseña</label>
                        <div class="input-group">
                            <input type="password" class="form-control form-control-lg" id="password"
                                   autocomplete="current-password" required minlength="8" maxlength="100">
                            <button class="btn btn-outline-secondary" type="button" id="togglePass" tabindex="-1">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg w-100 fw-semibold" id="btnLogin">
                        <span class="spinner-border spinner-border-sm me-2 d-none" id="spinner"></span>
                        <span id="btnLoginText">Acceder al panel</span>
                    </button>
                </form>
            </div>
        </div>
        <p class="text-center text-muted small mt-3 mb-0">Solo personal autorizado</p>
    </div>

    <script src="js/admin.js"></script>
</body>

</html>
